[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "human-punching"
version = "0.1.0"
description = "DuoBox full-body punch retargeting and MuJoCo human previews"
requires-python = ">=3.10,<3.14"
dependencies = ["mujoco==3.11.0", "numpy>=2.0", "scipy>=1.14", "pillow>=10", "imageio>=2.34", "imageio-ffmpeg>=0.6"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff"]

[project.scripts]
human-punching = "human_punching.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
cache_dir = ".cache/pytest"
addopts = "--basetemp=.cache/pytest-tmp"

[tool.ruff]
line-length = 100
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
